<!DOCTYPE html>
<html class="dark" lang="en"><head>

                        "tertiary-container": "#adaec7",
                        "surface-container": "#1e2020",
                        "background": "#121414",
                        "surface-variant": "#333535",
                        "tertiary-fixed-dim": "#c4c4de",
                        "secondary-fixed": "#d8e2ff",
                        "on-tertiary-fixed": "#181a2d",
                        "on-background": "#e2e2e2",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0c0f0f",
                        "on-secondary": "#263046",
                        "surface-tint": "#ffb77c",

                        "surface-container-high": "#282a2b",
                        "surface-bright": "#37393a",
                        "surface": "#121414",
                        "on-secondary-container": "#aeb8d4",
                        "surface-container-low": "#1a1c1c",

                    "borderRadius": {

<style>
        body {
            background-color: #16182B;
            color: #e2e2e2;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(37, 47, 69, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-focus-accent:focus-within {
            border-color: #FF962D;
            box-shadow: 0 0 0 1px #FF962D;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-on-surface">
<header class="fixed top-0 w-full z-50 bg-[#16182B]/80 backdrop-blur-xl border-b border-white/10 flex items-center justify-between px-5 h-16 w-full">
<button class="text-[#FF962D] hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Space_Grotesk'] font-bold tracking-tight text-2xl font-black text-[#FF962D] tracking-tighter">UniPin</h1>
<div class="w-6"></div>
</header>
<main class="min-h-screen pt-24 pb-12 px-margin-main flex flex-col items-center max-w-md mx-auto">
<div class="w-full mb-unit-xl text-center md:text-left">
<!-- Updated logo with the new URL and larger size -->
<img alt="UniPin Logo" class="w-auto mx-auto mb-unit-md object-contain h-48 rounded-2xl shadow-2xl" src="https://i.pinimg.com/1200x/a3/b2/9e/a3b29e8411d3ae14b253a3f3302da629.jpg"/>
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-unit-xs text-center">Welcome to UniPin</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Login to your account to continue your gaming journey.</p>
</div>
<div class="w-full space-y-unit-lg">
<div class="space-y-unit-md">
<div class="space-y-unit-xs group">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Email Address</label>
<div class="glass-card rounded-xl flex items-center px-unit-md py-unit-sm input-focus-accent transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-unit-sm" data-icon="mail">mail</span>
<input id="email" class="bg-transparent border-none focus:ring-0 w-full text-body-md font-body-md placeholder:text-on-surface-variant/40 outline-none" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-unit-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Password</label>
<div class="glass-card rounded-xl flex items-center px-unit-md py-unit-sm input-focus-accent transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-unit-sm" data-icon="lock">lock</span>
<input id="password" class="bg-transparent border-none focus:ring-0 w-full text-body-md font-body-md placeholder:text-on-surface-variant/40 outline-none" placeholder="••••••••" type="password"/>
<button class="text-on-surface-variant hover:text-brand-accent transition-colors">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-unit-xs">
<a class="font-label-md text-label-md text-brand-accent hover:underline" href="#">Forgot Password?</a>
</div>
</div>
</div>
<button id="loginBtn" class="w-full bg-[#FF962D] text-brand-deep font-['Space_Grotesk'] font-bold py-4 rounded-xl text-body-lg hover:opacity-90 active:scale-95 transition-all shadow-[0_8px_30px_rgb(255,150,45,0.2)]">
                LOG IN
            </button>
<div class="relative flex py-unit-md items-center">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or login with</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<div class="grid grid-cols-2 gap-unit-md">
<button class="glass-card rounded-xl py-unit-sm flex items-center justify-center hover:bg-white/5 transition-colors active:scale-95">
<img alt="Google" class="w-5 h-5 mr-unit-sm" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"/>
<span class="font-label-lg text-label-lg">Google</span>
</button>
<button class="glass-card rounded-xl py-unit-sm flex items-center justify-center hover:bg-white/5 transition-colors active:scale-95">
<span class="material-symbols-outlined text-[#1877F2] mr-unit-sm" data-icon="facebook" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span class="font-label-lg text-label-lg">Facebook</span>
</button>
</div>
</div>
<footer class="mt-auto pt-unit-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account?
                <a class="text-brand-accent font-bold hover:underline ml-1" href="#">Sign Up</a>
</p>
</footer>
</main>
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-brand-accent/5 blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-5%] left-[-5%] w-[400px] h-[400px] rounded-full bg-brand-accent/3 blur-[100px] pointer-events-none -z-10"></div>

<script>
    document.getElementById('loginBtn').addEventListener('click', function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (typeof Android !== 'undefined') {
            Android.login(email, password);
        } else {
            console.log("Android interface not found", email, password);
        }
    });
</script>

</body></html>
